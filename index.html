<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    color:#333;
}

/* Header */
header{
    background:#2563eb;
    color:white;
    padding:18px 40px;
}

header h1{
    font-size:24px;
}

header p{
    margin-top:5px;
}

/* Navigation */
nav{
    background:white;
    padding:12px 40px;
    box-shadow:0 2px 5px #ddd;
}

nav button{
    background:none;
    border:0;
    padding:10px 18px;
    cursor:pointer;
    font-size:15px;
}

nav button:hover{
    color:#2563eb;
}

/* Main */
main{
    width:90%;
    max-width:1100px;
    margin:25px auto;
}

section{
    display:none;
}

section.active{
    display:block;
}

/* Cards */
.cards{
    display:flex;
    gap:20px;
    margin-top:20px;
}

.card{
    background:white;
    padding:20px;
    flex:1;
    border-radius:8px;
    box-shadow:0 2px 8px #ddd;
}

.card h3{
    color:#666;
    font-size:15px;
}

.card h2{
    color:#2563eb;
    margin-top:10px;
}

/* Box */
.box{
    background:white;
    padding:20px;
    margin-top:20px;
    border-radius:8px;
    box-shadow:0 2px 8px #ddd;
}

/* Form */
input,select{
    width:100%;
    padding:11px;
    margin:8px 0 15px;
    border:1px solid #ccc;
    border-radius:5px;
}

button.primary{
    background:#2563eb;
    color:white;
    border:0;
    padding:10px 18px;
    border-radius:5px;
    cursor:pointer;
}

/* Search */
.search{
    margin-bottom:15px;
}

/* Table */
table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:11px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#2563eb;
    color:white;
}

.edit{
    background:#f59e0b;
    color:white;
    border:0;
    padding:6px 10px;
    border-radius:4px;
    cursor:pointer;
}

.delete{
    background:#ef4444;
    color:white;
    border:0;
    padding:6px 10px;
    border-radius:4px;
    cursor:pointer;
}

/* Mobile */
@media(max-width:700px){
    .cards{
        flex-direction:column;
    }

    nav{
        padding:10px;
    }

    main{
        width:95%;
    }

    table{
        font-size:12px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎓 Student Management System</h1>
    <p>Manage student records easily</p>
</header>

<nav>
    <button onclick="show('dashboard')">🏠 Dashboard</button>
    <button onclick="show('students')">👨‍🎓 Students</button>
    <button onclick="show('add')">➕ Add Student</button>
</nav>

<main>

<!-- Dashboard -->
<section id="dashboard" class="active">

    <h2>Dashboard</h2>

    <div class="cards">

        <div class="card">
            <h3>Total Students</h3>
            <h2 id="total">0</h2>
        </div>

        <div class="card">
            <h3>Departments</h3>
            <h2 id="departments">0</h2>
        </div>

        <div class="card">
            <h3>System Status</h3>
            <h2>Active</h2>
        </div>

    </div>

    <div class="box">
        <h3>Welcome</h3>
        <p style="margin-top:10px">
            This system allows you to add, view, edit and delete
            student information.
        </p>
    </div>

</section>


<!-- Students -->
<section id="students">

    <h2>Student Records</h2>

    <div class="box">

        <input
            class="search"
            id="search"
            placeholder="🔍 Search student..."
            onkeyup="display()"
        >

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Roll No</th>
                    <th>Department</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="table"></tbody>

        </table>

    </div>

</section>


<!-- Add Student -->
<section id="add">

    <h2 id="formTitle">Add Student</h2>

    <div class="box">

        <input id="name" placeholder="Student Name">

        <input id="roll" placeholder="Roll Number">

        <select id="dept">

            <option value="">Select Department</option>
            <option>CSE</option>
            <option>CSE (AIML)</option>
            <option>ECE</option>
            <option>EEE</option>
            <option>MECH</option>
            <option>CIVIL</option>

        </select>

        <input id="email" type="email" placeholder="Email">

        <button class="primary" onclick="save()">
            Save Student
        </button>

    </div>

</section>

</main>


<script>

let students =
JSON.parse(localStorage.getItem("students")) || [];

let editId = -1;


/* Show page */
function show(id){

    document.querySelectorAll("section")
    .forEach(s => s.classList.remove("active"));

    document.getElementById(id)
    .classList.add("active");

    if(id === "students")
        display();
}


/* Save student */
function save(){

    let student = {
        name:document.getElementById("name").value,
        roll:document.getElementById("roll").value,
        dept:document.getElementById("dept").value,
        email:document.getElementById("email").value
    };

    if(!student.name || !student.roll || !student.dept){
        alert("Please fill all details");
        return;
    }

    if(editId === -1)
        students.push(student);
    else
        students[editId] = student;

    localStorage.setItem(
        "students",
        JSON.stringify(students)
    );

    clear();

    show("students");

    update();
}


/* Display students */
function display(){

    let search =
    document.getElementById("search").value.toLowerCase();

    let html = "";

    students.forEach((s,i)=>{

        if(
            s.name.toLowerCase().includes(search) ||
            s.roll.toLowerCase().includes(search) ||
            s.dept.toLowerCase().includes(search)
        ){

            html += `
            <tr>
                <td>${i+1}</td>
                <td>${s.name}</td>
                <td>${s.roll}</td>
                <td>${s.dept}</td>
                <td>${s.email}</td>
                <td>
                    <button class="edit"
                    onclick="edit(${i})">Edit</button>

                    <button class="delete"
                    onclick="remove(${i})">Delete</button>
                </td>
            </tr>`;
        }
    });

    document.getElementById("table").innerHTML = html;
}


/* Edit */
function edit(i){

    let s = students[i];

    document.getElementById("name").value = s.name;
    document.getElementById("roll").value = s.roll;
    document.getElementById("dept").value = s.dept;
    document.getElementById("email").value = s.email;

    editId = i;

    document.getElementById("formTitle").innerText =
    "Edit Student";

    show("add");
}


/* Delete */
function remove(i){

    if(confirm("Delete this student?")){

        students.splice(i,1);

        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );

        display();
        update();
    }
}


/* Clear */
function clear(){

    document.getElementById("name").value="";
    document.getElementById("roll").value="";
    document.getElementById("dept").value="";
    document.getElementById("email").value="";

    editId=-1;

    document.getElementById("formTitle").innerText =
    "Add Student";
}


/* Dashboard */
function update(){

    document.getElementById("total").innerText =
    students.length;

    let departments =
    new Set(students.map(s=>s.dept));

    document.getElementById("departments").innerText =
    departments.size;
}


/* Start */
update();
display();

</script>

</body>
</html>
